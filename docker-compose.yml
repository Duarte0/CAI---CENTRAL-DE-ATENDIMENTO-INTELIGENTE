services:
  postgres:
    image: postgres:16.14-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cai}
      POSTGRES_USER: ${POSTGRES_USER:-cai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    command: ["postgres", "-c", "timezone=${APP_TIMEZONE:-America/Sao_Paulo}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cai}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade ${ALEMBIC_TARGET_REVISION:-head}
    restart: "no"

  maintenance:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: Dockerfile
      target: maintenance
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-cai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cai}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ${MAINTENANCE_REPORT_DIR:-./reports}:/reports
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: ["sleep", "infinity"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-cai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cai}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  ia_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-cai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cai}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m src.workers.ia_worker
    healthcheck:
      disable: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  audio_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cai}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m src.workers.audio_worker
    healthcheck:
      disable: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  image_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cai}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m src.workers.image_worker
    healthcheck:
      disable: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  ralph:
    build:
      context: .
      dockerfile: Dockerfile
      target: ralph
    group_add:
      # Resolve at launch with:
      # DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock) docker compose up -d --build --no-deps ralph
      # The root fallback keeps read-only Compose commands usable before launch.
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - .:/app
      - codex_auth:/root/.codex
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-cai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cai}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  codex_auth:
