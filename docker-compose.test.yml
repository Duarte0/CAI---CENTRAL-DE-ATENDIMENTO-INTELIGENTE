services:
  postgres-test:
    image: postgres:16.14-alpine
    ports:
      - target: 5432
        published: 0
        host_ip: 127.0.0.1
    environment:
      POSTGRES_DB: cai_test
      POSTGRES_USER: cai_test
      POSTGRES_PASSWORD: cai_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cai_test -d cai_test"]
      interval: 2s
      timeout: 2s
      retries: 20
